services:
  db:
    image: postgres:16
    container_name: kamkazi-pg
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: kamkazi
      POSTGRES_USER: kamkazi
      POSTGRES_PASSWORD: kamkazi
    volumes:
      - kamkazi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamkazi -d kamkazi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kamkazi_pgdata: